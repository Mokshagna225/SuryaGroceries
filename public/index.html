<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Surya's Groceries - Order fresh groceries, premium spices, daily essentials, and kitchen staples online with fast doorstep delivery.">
  <meta name="keywords" content="Surya's Groceries, SuryasGroceries, Surya Grocery Store, online grocery shopping, fresh groceries online, daily essentials">
  <meta name="author" content="Surya's Groceries">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Google search previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Surya's Groceries - Online Grocery & Daily Essentials">
  <meta property="og:description" content="Shop groceries, pulses, spices, and everyday kitchen essentials with superfast home delivery.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Surya's Groceries">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Surya's Groceries - Online Groceries & Daily Needs</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Container for Firebase Phone Auth invisible reCAPTCHA -->
  <div id="recaptcha-container"></div>

  <script>
    // PWA install prompt handler for Laptop / Tablet / Mobile Chrome
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      console.log('PWA install prompt is ready');
    });

    window.triggerPwaInstall = async function() {
      if (window.deferredPwaPrompt) {
        window.deferredPwaPrompt.prompt();
        var choice = await window.deferredPwaPrompt.userChoice;
        window.deferredPwaPrompt = null;
        return choice && choice.outcome === 'accepted';
      }
      return false;
    };

    window.addEventListener('request-pwa-install', function() {
      if (window.deferredPwaPrompt) {
        window.deferredPwaPrompt.prompt();
        window.deferredPwaPrompt.userChoice.then(function(choice) {
          window.deferredPwaPrompt = null;
          console.log('PWA installation status:', choice.outcome);
        });
      }
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Auto-refresh service worker cache to ensure latest Flutter app is served
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].update();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=2.0.3" async></script>
</body>
</html>
